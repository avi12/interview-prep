      #bar {
        height: 90px;

      }
      #corner {
        position: fixed;

        width: 220px;

      }

  <body>
    <div id="bar"></div>
    <pre>def two_sum(nums, target):
    seen = {}
    for index, value in enumerate(nums):
        if target - value in seen:
            return [seen[target - value], index]
        seen[value] = index</pre
    >
    <div id="corner"></div>
  </body>
